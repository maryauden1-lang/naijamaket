<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Listing - {{ listing.title }}</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F8F9FA;
    }
    .jiji-purple-header {
      background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 100%);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="jiji-purple-header text-white h-16 flex items-center shadow-md">
    <div class="max-w-3xl mx-auto px-4 w-full flex items-center justify-between">
      <a href="{% url 'marketplace:dashboard' %}" class="flex items-center gap-2 text-white font-bold text-xs">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Cancel & Back</span>
      </a>
      <span class="font-extrabold text-sm sm:text-base">Edit Posted Listing</span>
      <span class="w-12"></span>
    </div>
  </header>

  <!-- Edit Form Card -->
  <main class="max-w-2xl mx-auto px-4 py-6 w-full flex-1">
    <div class="bg-white rounded-2xl p-5 sm:p-7 border border-slate-200 shadow-sm">
      
      <form method="POST" class="space-y-4">
        {% csrf_token %}

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Title</label>
          {{ form.title }}
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Category</label>
            {{ form.category }}
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Subcategory</label>
            {{ form.subcategory }}
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Price (₦)</label>
            {{ form.price }}
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Condition</label>
            {{ form.condition }}
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">State</label>
            {{ form.state }}
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Area / Market</label>
            {{ form.area }}
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Description</label>
          {{ form.description }}
        </div>

        <div class="pt-4 flex items-center justify-end gap-3">
          <a href="{% url 'marketplace:dashboard' %}" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-colors">
            Cancel
          </a>
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-purple-700 hover:bg-purple-800 text-white font-bold text-xs shadow-md transition-all">
            Save Changes
          </button>
        </div>

      </form>

    </div>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
